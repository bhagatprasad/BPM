<div class="profile-card">
         <div class="card-header">
            <h3><i class="fas fa-key"></i> CHANGE PASSWORD</h3>
              <div class="card-actions">                  
                  <button class="btn btn-edit" *ngIf="!isChangePassword" (click)="Edit.emit()">
                    <i class="fas fa-edit"></i>Edit
                  </button>              
                  <ng-container *ngIf="isChangePassword"  >
                    <button class="btn btn-save" (click)="save.emit()">
                      <i fas fa-save></i>
                      Save
                    </button>
                    <button class="btn btn-cancel" (click)="cancel.emit()">
                    <i fas fa-cancel></i>
                    Cancel
                    </button>
                  </ng-container>                                      
              </div>  
          </div>
          
          <div class="card-body">           
                  <div class="profile-grid">
                    <div class="form-group">
                      <label for="newPassword" class="form-label">New Password<span class="required">*</span></label>
                      <div class="input-wrapper">
                      <i class="fas fa-key input-icon"></i>
                      <input 
                        class="form-control"
                        [type]="showPassword?'text':'password'"
                        [(ngModel)]="changePswd.newPassword"
                        id="newPassword"
                        name="newPassword"
                        placeholder="New Password"
                        #newPassword="ngModel"
                        [class.is-invalid]="newPassword.invalid && newPassword.touched"
                        >
                         <button type="button" class="password-toggle" (click)="togglePassword.emit()">
                         <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
                         </button>
                        </div>
                    </div>
                  </div>
                  <div class="profile-grid">
                          <div class="form-group">
                              <label for="confirmPassword" class="form-label">Confirm Password<span class="required">*</span></label>
                                <div class="input-wrapper">
                                  <i class="fas fa-key input-icon"></i>
                                    <input 
                                      class="form-control"
                                      [type]="showConfirmPassword?'text':'password'"
                                      [(ngModel)]="changePswd.confirmPassword"
                                      id="confirmPassword"
                                      name="confirmPassword"
                                      placeholder="Confirm Password"
                                      #confirmPassword="ngModel"
                                      [class.is-invalid]="(confirmPassword.invalid && confirmPassword.touched) || 
                                       (changePswd.confirmPassword && changePswd.newPassword !== changePswd.confirmPassword)"
                                      >
                                       <button type="button" class="password-toggle" (click)="toggleConfirmPassword.emit()">
                                       <i class="fas" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword"></i>
                                      </button>
                                  </div>
                          </div>
                   </div>
              
            </div>
    </div>
