<div class="profile-card">
    <div class="card-header">
        <h3><i class="ri-key-2-line"></i> CHANGE PASSWORD</h3>
        <div class="card-actions">
            <button *ngIf="!isChangePassword" (click)="onEdit()" class="btn btn-edit">
                <i class="ri-edit-2-line"></i> Edit
            </button>
            <ng-container *ngIf="isChangePassword">
                <button (click)="onSave()" class="btn btn-save">
                    <i class="ri-save-2-line"></i> Save
                </button>
                <button (click)="onCancel()" class="btn btn-cancel">
                    <i class="ri-close-line"></i> Cancel
                </button>
            </ng-container>
        </div>
    </div>

    <div class="card-body">
        <div class="profile-grid">
            <!-- New Password -->
            <div class="form-group">
                <label for="newPassword" class="form-label">
                    New Password <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <i class="ri-lock-2-line input-icon"></i>
                    <input 
                        type="text" 
                        id="newPassword"
                        [type]="showPassword ? 'text' : 'password'"
                        [(ngModel)]="changePswd.newPassword" 
                        [readonly]="!isChangePassword"
                        [class.editable]="isChangePassword"
                        [class.readonly]="!isChangePassword"
                        [class.error]="errorMsz && !changePswd.newPassword"
                        class="form-control"
                        placeholder="Enter new password"
                        #newPassword="ngModel"
                        required
                        minlength="6"
                    >
                    <button 
                        type="button" 
                        class="password-toggle-btn" 
                        (click)="onTogglePassword()"
                        [disabled]="!isChangePassword"
                        [class.active]="showPassword"
                        title="Toggle password visibility"
                    >
                        <i class="ri-eye-line" *ngIf="!showPassword"></i>
                        <i class="ri-eye-off-line" *ngIf="showPassword"></i>
                    </button>
                </div>
                <div *ngIf="errorMsz && !changePswd.newPassword" class="field-error">
                    <i class="ri-error-warning-line"></i> Password is required
                </div>
                <div *ngIf="newPassword.invalid && newPassword.touched && changePswd.newPassword" class="field-error">
                    <span *ngIf="newPassword.errors?.['minlength']">
                        <i class="ri-error-warning-line"></i> Password must be at least 6 characters
                    </span>
                </div>
                <!-- Password strength indicator -->
                <div *ngIf="isChangePassword && changePswd.newPassword && changePswd.newPassword.length >= 6" 
                     class="password-strength">
                    <span class="strength-label">Strength:</span>
                    <div class="strength-bar">
                        <div class="strength-level" 
                             [class.weak]="getPasswordStrength(changePswd.newPassword) === 'weak'"
                             [class.medium]="getPasswordStrength(changePswd.newPassword) === 'medium'"
                             [class.strong]="getPasswordStrength(changePswd.newPassword) === 'strong'"
                             [style.width.%]="getPasswordStrengthWidth(changePswd.newPassword)">
                        </div>
                    </div>
                    <span class="strength-text" 
                          [class.weak]="getPasswordStrength(changePswd.newPassword) === 'weak'"
                          [class.medium]="getPasswordStrength(changePswd.newPassword) === 'medium'"
                          [class.strong]="getPasswordStrength(changePswd.newPassword) === 'strong'">
                        {{ getPasswordStrength(changePswd.newPassword) | titlecase }}
                    </span>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirmPassword" class="form-label">
                    Confirm Password <span class="required">*</span>
                </label>
                <div class="input-wrapper">
                    <i class="ri-check-double-line input-icon"></i>
                    <input 
                        type="text" 
                        id="confirmPassword"
                        [type]="showConfirmPassword ? 'text' : 'password'"
                        [(ngModel)]="changePswd.confirmPassword" 
                        [readonly]="!isChangePassword"
                        [class.editable]="isChangePassword"
                        [class.readonly]="!isChangePassword"
                        [class.error]="errorMsz && !changePswd.confirmPassword"
                        class="form-control"
                        placeholder="Confirm your password"
                        #confirmPassword="ngModel"
                        required
                    >
                    <button 
                        type="button" 
                        class="password-toggle-btn" 
                        (click)="onToggleConfirmPassword()"
                        [disabled]="!isChangePassword"
                        [class.active]="showConfirmPassword"
                        title="Toggle password visibility"
                    >
                        <i class="ri-eye-line" *ngIf="!showConfirmPassword"></i>
                        <i class="ri-eye-off-line" *ngIf="showConfirmPassword"></i>
                    </button>
                </div>
                <div *ngIf="errorMsz && !changePswd.confirmPassword" class="field-error">
                    <i class="ri-error-warning-line"></i> Confirm password is required
                </div>
                <div *ngIf="changePswd.confirmPassword && changePswd.newPassword !== changePswd.confirmPassword" 
                     class="field-error password-mismatch">
                    <i class="ri-error-warning-line"></i> Passwords do not match
                </div>
                <div *ngIf="changePswd.confirmPassword && changePswd.newPassword === changePswd.confirmPassword" 
                     class="field-success">
                    <i class="ri-checkbox-circle-line"></i> Passwords match
                </div>
            </div>
        </div>

        <!-- Edit Mode Indicator -->
        <div *ngIf="isChangePassword" class="edit-indicator">
            <i class="ri-edit-2-line"></i>
            <span>You are changing your password</span>
        </div>
    </div>
</div>
