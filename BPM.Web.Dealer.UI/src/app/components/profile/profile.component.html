<div class="profile-wrapper">
  <!-- Profile Header -->
  <div class="profile-header-section">
    <div class="user-info-header">
      <div class="user-avatar-large">
        <i class="fas fa-user-circle"></i>
      </div>
      <div class="user-details">
        <h2>MY PROFILE</h2>
        <p class="user-role-badge" >{{ userSection.firstName }} {{ userSection.lastName }} </p>
      </div>
    </div>
    <button class="btn-refresh" (click)="loadUserData()" title="Refresh Profile">
      <i class="fas fa-sync-alt"></i> Refresh
    </button>
  </div>

  <!-- Error Message -->
  <div *ngIf="errorMessage" class="alert alert-error">
    <div class="alert-content">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
    </div>
    <button (click)="errorMessage = ''" class="close-btn">×</button>
  </div>

  <!-- Success Message -->
  <div *ngIf="successMessage" class="alert alert-success">
    <div class="alert-content">
      <i class="fas fa-check-circle"></i>
      <span>{{ successMessage }}</span>
    </div>
    <button (click)="successMessage" class="close-btn">×</button>
  </div>

  <!-- Scroll Container -->
  <div  class="scroll-container">
       <!-- ==================== PERSONAL INFORMATION CARD ==================== -->
    <app-user-personal-info
     [userPersionalSection]="userSection"
      [isUserEditing]="isEditing"
      [errorMsz]="errorMessage"
      (Edit)="enableEdit()"
      (save)="saveUserChanges()"
      (cancel)="cancelEdit()"
    >
    </app-user-personal-info>

    <!-- ==================== CHANGE PASSWORD CARD ==================== -->
    <app-change-password
    [changePswd]="changePassword"
    [isChangePassword]="isChangePassword"
    [showPassword]="showPassword"
    [showConfirmPassword]="showConfirmPassword"
    (Edit)="enablePasswordEdit()"
    (togglePassword)="togglePasswordVisibility()"
    (toggleConfirmPassword)="toggleConfirmPasswordVisibility()"
    (save)="savePasswordChanges()"
    (cancel)="cancelPasswordChanges()"    
    >
    </app-change-password>
    
    <!-- ==================== DEALER INFORMATION CARD ==================== -->
    <app-dealer-info-section
    [isAdmin]="isAdmin"
    [dealerSection]="dealerSection"
    [isDealerEditing]="isDealerEditing" 
    [errorMessage]="errorMessage"
    (Edit)="enableDealerEdit()"      
    (save)="saveDealerChanges()"
    (cancel)="cancelDealerEdit()"
    >      
    </app-dealer-info-section>
  </div>
  
</div>
