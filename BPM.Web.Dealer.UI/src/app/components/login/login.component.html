<div class="login-wrapper" style="max-width: 100%; padding: 0 30px;">
    <!-- Modern Pharmacy Logo -->
    <div class="text-center mb-4">
        <a class="pharmacy-logo" href="/">
            <div class="logo-icon">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="48" fill="url(#logoGradient)" stroke="#0d9488" stroke-width="2" />
                    <rect x="40" y="20" width="20" height="60" rx="3" fill="white" opacity="0.95" />
                    <rect x="20" y="40" width="60" height="20" rx="3" fill="white" opacity="0.95" />
                    <path d="M70 30 C78 25, 85 30, 82 40 C79 50, 72 48, 70 45 C68 42, 65 38, 70 30Z"
                          fill="white" opacity="0.8" transform="rotate(15, 75, 35)" />
                    <path d="M30 70 C22 75, 15 70, 18 60 C21 50, 28 52, 30 55 C32 58, 35 62, 30 70Z"
                          fill="white" opacity="0.8" transform="rotate(-15, 25, 65)" />
                    <text x="50" y="48" text-anchor="middle" font-size="22" font-weight="800"
                          font-family="Arial, sans-serif" fill="#0d9488" letter-spacing="2">B</text>
                    <text x="50" y="68" text-anchor="middle" font-size="16" font-weight="700"
                          font-family="Arial, sans-serif" fill="#0e7490" letter-spacing="1">PM</text>
                    <circle cx="25" cy="25" r="3" fill="white" opacity="0.3" />
                    <circle cx="75" cy="25" r="3" fill="white" opacity="0.3" />
                    <circle cx="25" cy="75" r="3" fill="white" opacity="0.3" />
                    <circle cx="75" cy="75" r="3" fill="white" opacity="0.3" />
                    <defs>
                        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#0d9488;stop-opacity:0.15" />
                            <stop offset="100%" style="stop-color:#0e7490;stop-opacity:0.08" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <div class="logo-text">
                <span class="brand-name">BPM Medicals</span>
                <span class="brand-tagline">Healthcare Solutions</span>
            </div>
        </a>
    </div>

    <!-- Sign In Form -->
    <div id="signin-form">
        <div class="text-center mb-4">
            <h3 class="fs-26 fw-medium animated-title" style="margin-bottom: 6px;">
                Welcome Back!
            </h3>
            <p class="fs-16 text-secondary lh-1-8" style="color: #64748b;">
                Sign in to your account
            </p>
        </div>

        <form #loginForm="ngForm" (ngSubmit)="onLogin()" novalidate>
            <div class="mb-20">
                <div class="input-group-enhanced form-floating-enhanced">
                    <input id="loginEmail" name="Email" class="form-control" placeholder=" " 
                           type="email" [(ngModel)]="loginObj.username" required
                           #emailField="ngModel"
                           [class.is-invalid]="emailField.invalid && emailField.touched" />
                    <i class="ri-mail-line input-icon"></i>
                    <label for="loginEmail">Email Address</label>
                    <span id="loginEmailError" class="text-danger" 
                          *ngIf="emailError || (emailField.invalid && emailField.touched)" 
                          style="font-size: 13px; margin-top: 5px;">
                        <span *ngIf="emailField.errors?.['required'] && emailField.touched">
                            <i class="ri-error-warning-line me-1"></i> Email address is required.
                        </span>
                        <span *ngIf="emailField.errors?.['email'] && emailField.touched">
                            <i class="ri-error-warning-line me-1"></i> Please enter a valid email address.
                        </span>
                        <span *ngIf="emailError">{{ emailError }}</span>
                    </span>
                </div>
            </div>

            <div class="mb-20">
                <div class="input-group-enhanced form-floating-enhanced">
                    <input id="loginPassword" name="Password" class="form-control password" 
                           placeholder=" " [type]="showPassword ? 'text' : 'password'"
                           [(ngModel)]="loginObj.password" required minlength="6"
                           #passwordField="ngModel"
                           [class.is-invalid]="passwordField.invalid && passwordField.touched" />
                    <i class="ri-lock-line input-icon"></i>
                    <label for="loginPassword">Your Password</label>
                    <i aria-hidden="true" class="ri-eye-off-line password-toggle" 
                       (click)="togglePasswordVisibility()"></i>
                    <span id="loginPasswordError" class="text-danger" 
                          *ngIf="passwordError || (passwordField.invalid && passwordField.touched)" 
                          style="font-size: 13px; margin-top: 5px;">
                        <span *ngIf="passwordField.errors?.['required'] && passwordField.touched">
                            <i class="ri-error-warning-line me-1"></i> Password is required.
                        </span>
                        <span *ngIf="passwordField.errors?.['minlength'] && passwordField.touched">
                            <i class="ri-error-warning-line me-1"></i> Password must be at least 6 characters.
                        </span>
                        <span *ngIf="passwordError">{{ passwordError }}</span>
                    </span>
                </div>
            </div>

            <div class="mb-20">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-1">
                    <label class="modern-checkbox">
                        <input id="rememberMe" name="RememberMe" type="checkbox" 
                               [(ngModel)]="rememberMe" />
                        <span class="checkmark"></span>
                        <span style="font-size: 14px; color: #475569;">Remember me</span>
                    </label>
                    <a class="forgot-link" (click)="onForgotPassword()" style="cursor: pointer;">
                        Forgot Password?
                    </a>
                </div>
            </div>

            <div class="mb-4">
                <button class="btn-modern" type="submit" 
                        [disabled]="loginForm.invalid || isLoading">
                    <i class="ri-login-circle-line me-2"></i> 
                    <span *ngIf="!isLoading">Sign In</span>
                    <span *ngIf="isLoading">
                        <i class="ri-loader-4-line ri-spin me-2"></i> Signing In...
                    </span>
                </button>
            </div>

            <!-- Error message display -->
            <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="ri-error-warning-line me-2"></i>
                {{ errorMessage }}
                <button type="button" class="btn-close" (click)="errorMessage = ''" aria-label="Close"></button>
            </div>

            <div class="divider">
                <span class="line"></span>
                <span class="text">or continue with</span>
                <span class="line"></span>
            </div>

            <ul class="p-0 mb-0 list-unstyled d-flex justify-content-center" style="gap: 12px;">
                <li>
                    <a class="social-btn facebook" href="https://www.facebook.com/" target="_blank">
                        <i class="ri-facebook-fill"></i>
                    </a>
                </li>
                <li>
                    <a class="social-btn twitter" href="https://www.twitter.com/" target="_blank">
                        <i class="ri-twitter-x-line"></i>
                    </a>
                </li>
                <li>
                    <a class="social-btn google" href="https://www.twitter.com/" target="_blank">
                        <i class="ri-google-fill"></i>
                    </a>
                </li>
                <li>
                    <a class="social-btn linkedin" href="https://www.linkedin.com/" target="_blank">
                        <i class="ri-linkedin-fill"></i>
                    </a>
                </li>
            </ul>
        </form>
    </div>
</div>
