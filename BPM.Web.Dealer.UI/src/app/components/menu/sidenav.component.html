<!-- Start Sidebar Area -->
<div class="sidebar-area" id="sidebar-area">
  <div class="logo position-relative d-flex align-items-center justify-content-between">
    <a class="d-block text-decoration-none position-relative" routerLink="/">
      <!-- BPM Medicals Logo SVG -->
      <svg width="38" height="38" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg"
        style="display: inline-block; vertical-align: middle">
        <!-- Background circle with gradient -->
        <circle cx="50" cy="50" r="48" fill="url(#sidebarLogoGradient)" stroke="#0d9488" stroke-width="2" />

        <!-- Medical Cross -->
        <rect x="40" y="20" width="20" height="60" rx="3" fill="white" opacity="0.95" />
        <rect x="20" y="40" width="60" height="20" rx="3" fill="white" opacity="0.95" />

        <!-- Leaf symbol -->
        <path d="M70 30 C78 25, 85 30, 82 40 C79 50, 72 48, 70 45 C68 42, 65 38, 70 30Z" fill="white" opacity="0.8"
          transform="rotate(15, 75, 35)" />
        <path d="M30 70 C22 75, 15 70, 18 60 C21 50, 28 52, 30 55 C32 58, 35 62, 30 70Z" fill="white" opacity="0.8"
          transform="rotate(-15, 25, 65)" />

        <!-- BPM Letters integrated -->
        <text x="50" y="48" text-anchor="middle" font-size="22" font-weight="800" font-family="Arial, sans-serif"
          fill="#0d9488" letter-spacing="2">
          B
        </text>
        <text x="50" y="68" text-anchor="middle" font-size="16" font-weight="700" font-family="Arial, sans-serif"
          fill="#0e7490" letter-spacing="1">
          PM
        </text>

        <!-- Small decorative dots -->
        <circle cx="25" cy="25" r="3" fill="white" opacity="0.3" />
        <circle cx="75" cy="25" r="3" fill="white" opacity="0.3" />
        <circle cx="25" cy="75" r="3" fill="white" opacity="0.3" />
        <circle cx="75" cy="75" r="3" fill="white" opacity="0.3" />

        <!-- Gradient definitions -->
        <defs>
          <linearGradient id="sidebarLogoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color: #0d9488; stop-opacity: 0.15" />
            <stop offset="100%" style="stop-color: #0e7490; stop-opacity: 0.08" />
          </linearGradient>
        </defs>
      </svg>
      <span class="logo-text text-secondary fw-semibold" style="
          font-size: 18px;
          background: linear-gradient(135deg, #0d9488, #0e7490);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        ">BPM Medicals</span>
    </a>
    <button
      class="sidebar-burger-menu-close bg-transparent py-3 border-0 opacity-0 z-n1 position-absolute top-50 end-0 translate-middle-y"
      id="sidebar-burger-menu-close">
      <span class="border-1 d-block for-dark-burger"
        style="border-bottom: 1px solid #475569; height: 1px; width: 25px; transform: rotate(45deg)">
      </span>
      <span class="border-1 d-block for-dark-burger" style="
          border-bottom: 1px solid #475569;
          height: 1px;
          width: 25px;
          transform: rotate(-45deg);
        ">
      </span>
    </button>
    <button class="sidebar-burger-menu bg-transparent p-0 border-0" id="sidebar-burger-menu">
      <span class="border-1 d-block for-dark-burger" style="border-bottom: 1px solid #475569; height: 1px; width: 25px">
      </span>
      <span class="border-1 d-block for-dark-burger"
        style="border-bottom: 1px solid #475569; height: 1px; width: 25px; margin: 6px 0">
      </span>
      <span class="border-1 d-block for-dark-burger" style="border-bottom: 1px solid #475569; height: 1px; width: 25px">
      </span>
    </button>
  </div>
